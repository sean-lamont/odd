defaults:
  - model: llada
  - strategy: odd
  - _self_

prompt: "Write a python function to compute fibonacci."
batch_size: 8
n_problems: 300
steps: 8
gen_length: 64
temperature: 0.01
#seed: 42
use_wandb: false
wandb_project: "text_dpp"
wandb_entity: null
use_confidence_weighting: true
ignore_pad: false

output_dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
